worker_processes 1;
events {
    worker_connections 1024;
}

http {
    # Docker service IPs change whenever Compose recreates a container.
    # Resolve service names dynamically instead of pinning an old container IP.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # Keep each challenge's static files on its own URL namespace.
        location /01-welcome/static/ {
            set $welcome_backend http://welcome:8080;
            proxy_pass $welcome_backend$request_uri;
            add_header Cache-Control "no-store" always;
        }

        location /04-bluebox/static/ {
            set $bluebox_backend http://bluebox:5000;
            proxy_pass $bluebox_backend$request_uri;
            add_header Cache-Control "no-store" always;
        }

        location /07-recipe/static/ {
            set $recipe_backend http://recipe:8080;
            proxy_pass $recipe_backend$request_uri;
            add_header Cache-Control "no-store" always;
        }

        location = /01-welcome {
            return 308 https://$host/01-welcome/;
        }

        # Backward-compatible routes for previously cached Welcome pages.
        location = /lock {
            set $welcome_backend http://welcome:8080;
            proxy_pass $welcome_backend/lock;
        }

        location = /secret1 {
            set $welcome_backend http://welcome:8080;
            proxy_pass $welcome_backend/secret1;
        }

        location = /secret2 {
            set $welcome_backend http://welcome:8080;
            proxy_pass $welcome_backend/secret2;
        }

        location = /secret3 {
            set $welcome_backend http://welcome:8080;
            proxy_pass $welcome_backend/secret3;
        }

        location /01-welcome/ {
            set $welcome_backend http://welcome:8080;
            rewrite ^/01-welcome/?(.*)$ /$1 break;
            proxy_pass $welcome_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /02-cybercorp1/ {
            set $cybercorp1_backend http://cybercorp1:8080;
            rewrite ^/02-cybercorp1/?(.*)$ /$1 break;
            proxy_pass $cybercorp1_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /03-cybercorp2/ {
            set $cybercorp2_backend http://cybercorp2:8080;
            rewrite ^/03-cybercorp2/?(.*)$ /$1 break;
            proxy_pass $cybercorp2_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /04-bluebox/ {
            set $bluebox_backend http://bluebox:5000;
            rewrite ^/04-bluebox/?(.*)$ /$1 break;
            proxy_pass $bluebox_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /05-lazydev1/ {
            set $lazydev1_backend http://lazydev1:8080;
            rewrite ^/05-lazydev1/?(.*)$ /$1 break;
            proxy_pass $lazydev1_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /06-santa/ {
            set $santa_backend http://santa:80;
            rewrite ^/06-santa/?(.*)$ /$1 break;
            proxy_pass $santa_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /07-recipe/ {
            set $recipe_backend http://recipe:8080;
            rewrite ^/07-recipe/?(.*)$ /$1 break;
            proxy_pass $recipe_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
