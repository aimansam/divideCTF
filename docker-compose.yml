services:
  nginx:
    image: nginx:alpine
    ports:
      - "7000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      welcome:
        condition: service_started
      cybercorp1:
        condition: service_healthy
      cybercorp2:
        condition: service_healthy
      bluebox:
        condition: service_started
      lazydev1:
        condition: service_started
      santa:
        condition: service_started
      recipe:
        condition: service_started

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      nginx:
        condition: service_started

  welcome:
    build: ./challenges/01-welcome
    ports:
      - "7001:8080"

  cybercorp1:
    build: ./challenges/02-cybercorp1
    ports:
      - "7002:8080"
    environment:
      - FLAG=divide{P455W0rD_134K3D_1N_P141N73X7}
      - BASE_PATH=/02-cybercorp1
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  cybercorp2:
    build: ./challenges/03-cybercorp2
    ports:
      - "7003:8080"
    environment:
      - FLAG=divide{CY83r_C0rP_607_8r34CH_4641N}
      - BASE_PATH=/03-cybercorp2
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8080), 2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  bluebox:
    build: ./challenges/04-bluebox
    ports:
      - "7004:5000"

  lazydev1:
    build: ./challenges/05-lazydev1
    ports:
      - "7005:8080"
    environment:
      - FLAG=divide{jwt_88123df91_m4nipul4t3d }

  santa:
    build: ./challenges/06-santa
    ports:                      
      - "7006:80"
    environment:
      - SANTA_FLAG=FLAG{hh0h0h0h0h0_th1s_1s_y0ur_pr1ze_3987df8}

  recipe:
    build: ./challenges/07-recipe
    ports:
      - "7007:8080"
    environment:
      - FLAG=divide{cookmesometh1ngpleas3_182heb4j5n2}
